<style>
  :root{
    --paper:#f7f3ea; --paper-2:#fffdf8;
    --ink:#1b2333; --ink-soft:#485267; --muted:#928c7d; --faint:#b3ac9b;
    --line:#e6dfcf; --hl:#ffe15a; --teal:#0f6b62; --teal-soft:#e3efec; --rose:#c0485a;
    --again:#c0485a; --hard:#c17d2e; --good:#2f8f5b; --easy:#2f7da3;
    --radius:20px;
    --shadow:0 20px 44px -18px rgba(40,32,20,.35), 0 3px 10px -4px rgba(40,32,20,.18);
    --font-disp:'Fraunces','Noto Sans Thai',Georgia,serif;
    --font-read:'Newsreader','Noto Sans Thai',Georgia,serif;
    --font-ui:'Space Grotesk','Noto Sans Thai',system-ui,sans-serif;
    --font-th:'Noto Sans Thai','Space Grotesk',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:var(--font-th);color:var(--ink);background:var(--paper);
    background-image:radial-gradient(circle at 100% 0%, rgba(15,107,98,.05), transparent 40%),
                     radial-gradient(circle at 0% 100%, rgba(255,225,90,.06), transparent 35%);
    min-height:100dvh;display:flex;justify-content:center;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  #app{width:100%;max-width:540px;min-height:100dvh;display:flex;flex-direction:column;padding:20px 18px 30px}

  /* header */
  .brandrow{display:flex;align-items:center;gap:11px;margin-bottom:16px}
  .mark{width:34px;height:34px;border-radius:10px;background:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .mark span{font-family:var(--font-disp);font-weight:600;font-size:19px;color:var(--hl);line-height:1}
  .brandtext{flex:1}
  .brandtext .name{font-family:var(--font-disp);font-weight:600;font-size:20px;line-height:1.1}
  .brandtext .tag{font-family:var(--font-ui);font-size:11px;letter-spacing:.03em;color:var(--muted);margin-top:1px}
  .streak{display:flex;align-items:center;gap:5px;font-family:var(--font-ui);font-weight:600;font-size:13px;color:#b8860b;background:rgba(255,225,90,.22);border:1px solid rgba(200,160,40,.3);padding:6px 10px;border-radius:99px;white-space:nowrap}

  /* main tabs */
  .tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:18px}
  .tab{font-family:var(--font-th);font-weight:600;font-size:15px;color:var(--faint);background:none;border:none;padding:6px 0 12px;cursor:pointer;position:relative;display:flex;align-items:center;gap:7px}
  .tab.active{color:var(--ink)}
  .tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink);border-radius:2px}
  .tab .badge{font-family:var(--font-ui);font-size:11px;font-weight:600;background:var(--teal-soft);color:var(--teal);padding:1px 7px;border-radius:99px}

  main{flex:1;display:flex;flex-direction:column}

  /* search bar */
  .searchbar{display:flex;gap:9px;margin-bottom:18px}
  .searchbar .inp{flex:1;position:relative}
  .searchbar input{width:100%;font-family:var(--font-th);font-size:16px;color:var(--ink);background:var(--paper-2);border:1.5px solid var(--line);border-radius:14px;padding:14px 15px 14px 42px}
  .searchbar input:focus{outline:none;border-color:var(--teal)}
  .searchbar input::placeholder{color:var(--faint)}
  .searchbar .inp::before{content:"";position:absolute;left:15px;top:50%;width:15px;height:15px;transform:translateY(-50%);border:2px solid var(--faint);border-radius:50%}
  .searchbar .inp::after{content:"";position:absolute;left:26px;top:calc(50% + 5px);width:7px;height:2px;background:var(--faint);transform:rotate(45deg);border-radius:2px}
  .searchbar .go{font-family:var(--font-th);font-weight:600;font-size:15px;color:#fff;background:var(--teal);border:none;border-radius:14px;padding:0 20px;cursor:pointer;white-space:nowrap;transition:transform .08s,opacity .15s}
  .searchbar .go:active{transform:scale(.97)}
  .searchbar .go:disabled{opacity:.5}

  .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:15px;padding:20px 16px 40px}
  .empty .big{font-family:var(--font-disp);font-size:38px;color:var(--ink);line-height:1.15}
  .empty .big em{font-style:italic;position:relative;white-space:nowrap}
  .empty .big em::after{content:"";position:absolute;left:-2px;right:-2px;top:34%;height:42%;background:var(--hl);z-index:-1;border-radius:2px}
  .empty p{color:var(--muted);font-size:14.5px;line-height:1.65;max-width:300px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:4px}
  .chip{font-family:var(--font-read);font-style:italic;font-size:16px;color:var(--teal);background:var(--teal-soft);border:none;padding:7px 15px;border-radius:99px;cursor:pointer}

  .loading{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:40px}
  .spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading p{color:var(--muted);font-family:var(--font-ui);font-size:13px;letter-spacing:.05em}

  .errbox{background:#fbeaec;border:1px solid #f0cad0;border-radius:16px;padding:18px;text-align:center;margin-top:6px}
  .errbox p{color:var(--rose);font-size:14px;line-height:1.6;margin-bottom:12px}
  .errbox button{font-family:var(--font-th);font-weight:600;font-size:14px;color:#fff;background:var(--rose);border:none;border-radius:11px;padding:10px 20px;cursor:pointer}
  .errdet{margin-top:14px;text-align:left}
  .errdet summary{cursor:pointer;font-family:var(--font-ui);font-size:11px;letter-spacing:.06em;color:var(--rose);opacity:.8}
  .errdet code{display:block;margin-top:8px;background:rgba(0,0,0,.04);border:1px solid #f0cad0;border-radius:8px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.5;color:#7a3540;white-space:pre-wrap;word-break:break-word;max-height:180px;overflow:auto}

  /* result / flash card shared */
  .card{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;animation:rise .3s ease}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .card-top{padding:22px 22px 18px;border-bottom:1px solid var(--line);position:relative}
  .wordline{display:flex;align-items:center;gap:12px}
  .headword{font-family:var(--font-disp);font-weight:600;font-size:38px;line-height:1.05;letter-spacing:-.01em;word-break:break-word}
  .spk{flex-shrink:0;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s}
  .spk:active{transform:scale(.9)}
  .spk.playing{background:var(--teal);border-color:var(--teal)}
  .spk svg{width:19px;height:19px;fill:var(--teal)}
  .spk.playing svg{fill:#fff}
  .spk.sm{width:30px;height:30px} .spk.sm svg{width:15px;height:15px}
  .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:9px}
  .reading{font-family:var(--font-ui);font-size:14.5px;color:var(--muted);letter-spacing:.02em}
  .pos{font-family:var(--font-ui);font-size:11.5px;font-weight:600;color:var(--teal);background:var(--teal-soft);padding:3px 9px;border-radius:6px}
  .meaning{font-size:16.5px;color:var(--ink-soft);line-height:1.55;margin-top:13px}

  .ex-wrap{padding:18px 22px 20px}
  .ex-label{font-family:var(--font-ui);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:15px}
  .ex{padding-left:15px;border-left:2px solid var(--line);margin-bottom:18px}
  .ex:last-child{margin-bottom:0}
  .ex .enrow{display:flex;align-items:flex-start;gap:9px}
  .ex .en{flex:1;font-family:var(--font-read);font-size:19px;line-height:1.5;color:var(--ink)}
  .ex .th{font-size:14px;color:var(--muted);line-height:1.55;margin-top:6px}
  mark.hl{background:linear-gradient(180deg,transparent 10%,var(--hl) 10% 78%,transparent 78%);color:inherit;padding:0 1px;border-radius:1px;font-style:normal;-webkit-box-decoration-break:clone;box-decoration-break:clone}

  .card-actions{padding:0 22px 20px}
  .pat-wrap{padding:0 22px 18px}
  .pat-chips{display:flex;flex-wrap:wrap;gap:7px}
  .pat-chip{font-family:var(--font-ui);font-size:12px;color:var(--teal);background:var(--teal-soft);padding:6px 11px;border-radius:99px;line-height:1.3}
  .dlg-wrap{padding:0 22px 18px;display:flex;flex-direction:column;gap:9px}
  .dlg-row{display:flex;align-items:flex-end;gap:8px}
  .dlg-row.b{flex-direction:row-reverse}
  .dlg-bubble{max-width:82%;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:9px 13px}
  .dlg-row.b .dlg-bubble{background:var(--teal-soft);border-color:transparent}
  .dlg-en{font-family:var(--font-read);font-size:14.5px;color:var(--ink);line-height:1.4}
  .dlg-th{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
  .addbtn{width:100%;font-family:var(--font-th);font-weight:600;font-size:15px;border:1.5px solid var(--teal);color:var(--teal);background:var(--paper-2);border-radius:13px;padding:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
  .addbtn.done{border-color:var(--line);color:var(--muted);background:var(--paper)}
  .notfound{padding:20px 22px 24px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}

  /* listen mode */
  .listen-chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-ui);font-weight:600;font-size:12.5px;color:var(--teal);background:var(--teal-soft);border:none;padding:8px 14px;border-radius:99px;cursor:pointer;margin-bottom:14px}
  .listen-chip.on{background:var(--ink);color:var(--paper-2)}
  .listen-card{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:34px 24px;text-align:center}
  .listen-count{font-family:var(--font-ui);font-size:12px;color:var(--faint);margin-bottom:16px}
  .listen-word{font-family:var(--font-disp);font-weight:600;font-size:34px;color:var(--ink)}
  .listen-mean{font-size:16px;color:var(--ink-soft);margin-top:10px}
  .listen-ex{font-family:var(--font-read);font-size:17px;color:var(--ink);margin-top:20px;line-height:1.5}
  .listen-ex-th{font-size:13px;color:var(--muted);margin-top:6px}
  .listen-controls{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:26px}
  .listen-btn{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .listen-btn.play{width:60px;height:60px;font-size:20px;background:var(--teal);border-color:var(--teal);color:#fff}
  .listen-hint{font-size:11.5px;color:var(--faint);margin-top:20px;line-height:1.5}

  /* flashcard segmented */
  .seg{display:flex;background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:18px}
  .seg button{flex:1;font-family:var(--font-th);font-weight:600;font-size:14px;color:var(--muted);border:none;background:none;padding:9px;border-radius:9px;cursor:pointer}
  .seg button.on{background:var(--ink);color:var(--paper-2)}

  /* graph-shape sparkline (shown on flashcard reveal) */
  .spark-wrap{display:flex;justify-content:center;margin-bottom:14px}
  .spark{width:132px;height:54px;display:block}

  /* review */
  .progress{height:5px;background:rgba(0,0,0,.06);border-radius:99px;overflow:hidden;margin-bottom:6px}
  .progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#3fa093);border-radius:99px;transition:width .3s}
  .counter{font-family:var(--font-ui);font-size:12.5px;color:var(--faint);letter-spacing:.03em;margin-bottom:14px;display:flex;justify-content:space-between}
  .fc{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:30px 24px;min-height:270px;display:flex;flex-direction:column;cursor:pointer}
  .fc .fc-kick{font-family:var(--font-ui);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:auto}
  .fc .fc-word{font-family:var(--font-disp);font-weight:600;font-size:36px;line-height:1.1;display:flex;align-items:center;gap:12px;margin:8px 0}
  .fc .fc-ipa{font-family:var(--font-ui);font-size:15px;color:var(--muted);margin-top:2px}
  .fc-hint{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-ui);font-size:12.5px;color:var(--faint);padding-top:18px}
  .fc-hint .key{border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:11px}
  .fc-div{height:1px;background:var(--line);margin:18px 0 16px}
  .fc-mean{font-size:17px;color:var(--ink);line-height:1.5;margin-bottom:14px}
  .fc-ex .enrow{display:flex;align-items:flex-start;gap:8px}
  .fc-ex .en{flex:1;font-family:var(--font-read);font-size:18px;line-height:1.5;color:var(--ink-soft)}
  .fc-ex .th{font-size:13.5px;color:var(--muted);margin-top:5px;line-height:1.5}
  .fc-answer{animation:rise .28s ease}

  .rate-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
  .rate{border:1px solid;border-radius:14px;background:transparent;padding:11px 4px 9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .08s}
  .rate:active{transform:translateY(1px) scale(.98)}
  .rate .lbl{font-family:var(--font-th);font-weight:600;font-size:14px}
  .rate .ivl{font-family:var(--font-ui);font-size:10px;color:var(--faint)}
  .rate.again{border-color:rgba(192,72,90,.4);background:rgba(192,72,90,.08)} .rate.again .lbl{color:var(--again)}
  .rate.hard{border-color:rgba(193,125,46,.4);background:rgba(193,125,46,.08)} .rate.hard .lbl{color:var(--hard)}
  .rate.good{border-color:rgba(47,143,91,.4);background:rgba(47,143,91,.08)} .rate.good .lbl{color:var(--good)}
  .rate.easy{border-color:rgba(47,125,163,.4);background:rgba(47,125,163,.08)} .rate.easy .lbl{color:var(--easy)}
  .btn-reveal{width:100%;margin-top:14px;font-family:var(--font-th);font-weight:600;font-size:16px;color:#fff;background:var(--teal);border:none;border-radius:14px;padding:15px;cursor:pointer;transition:transform .08s}
  .btn-reveal:active{transform:translateY(1px)}

  .center-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:50px 20px}
  .center-state .emoji{font-size:44px}
  .center-state h2{font-family:var(--font-disp);font-weight:600;font-size:22px}
  .center-state p{color:var(--muted);font-size:14.5px;line-height:1.6;max-width:290px}
  .ghost-btn{font-family:var(--font-th);font-weight:600;font-size:15px;color:var(--teal);background:var(--teal-soft);border:none;border-radius:12px;padding:12px 22px;cursor:pointer}

  /* stats */
  .exam-card{background:var(--ink);border-radius:16px;padding:18px 20px;margin-bottom:14px;text-align:center}
  .exam-card.urgent{background:linear-gradient(135deg,var(--ink),#3d2a1f)}
  .exam-card-title{font-family:var(--font-th);font-weight:600;font-size:15px;color:var(--paper-2);margin-bottom:4px}
  .exam-card-sub{font-size:12px;color:rgba(255,255,255,.55);margin-bottom:12px}
  .exam-card input[type=date]{color-scheme:dark}
  .exam-days{font-family:var(--font-disp);font-weight:600;font-size:42px;color:var(--hl,#ffe15a);line-height:1}
  .exam-days-lbl{font-family:var(--font-ui);font-size:11.5px;color:rgba(255,255,255,.6);letter-spacing:.05em;margin-top:2px}
  .exam-goal{font-size:13px;color:var(--paper-2);line-height:1.6;margin-top:10px}
  .exam-goal b{color:var(--hl,#ffe15a)}
  .exam-card .iconbtn{color:rgba(255,255,255,.5);margin-top:6px}
  .exam-card .iconbtn:hover{color:#fff}
  .seg4 button{font-size:12.5px;padding:9px 4px}

      {en:"Trust is [[integral]] to any relationship.",th:"ความไว้วางใจเป็นสิ่งสำคัญของทุกความสัมพันธ์"}]},
    "prevalent":{ipa:"/ˈprevələnt/",pos:"คำคุณศัพท์",meaning:"แพร่หลาย, ที่พบได้ทั่วไป",examples:[
      {en:"Smartphones are [[prevalent]] among young people.",th:"สมาร์ตโฟนแพร่หลายในหมู่คนรุ่นใหม่"},
      {en:"This disease is more [[prevalent]] in cold climates.",th:"โรคนี้พบได้บ่อยกว่าในเขตอากาศหนาว"}]},
    "viable":{ipa:"/ˈvaɪəbl/",pos:"คำคุณศัพท์",meaning:"ที่ทำได้จริง, มีความเป็นไปได้",examples:[
      {en:"Solar power is now a [[viable]] option.",th:"พลังงานแสงอาทิตย์เป็นทางเลือกที่ทำได้จริงในตอนนี้"},
      {en:"We need a [[viable]] solution to the problem.",th:"เราต้องการทางออกที่เป็นไปได้จริงสำหรับปัญหานี้"}]},
    "advocate":{ipa:"/ˈædvəkeɪt/",pos:"คำกริยา",meaning:"สนับสนุน, เรียกร้อง",examples:[
      {en:"Many experts [[advocate]] a healthy lifestyle.",th:"ผู้เชี่ยวชาญหลายคนสนับสนุนวิถีชีวิตที่ดีต่อสุขภาพ"},
      {en:"She [[advocates]] for equal rights.",th:"เธอเรียกร้องเพื่อสิทธิที่เท่าเทียม"}]},
    "hinder":{ipa:"/ˈhɪndər/",pos:"คำกริยา",meaning:"ขัดขวาง, เป็นอุปสรรค",examples:[

    "phenomenon":{ipa:"/fəˈnɒmɪnən/",pos:"คำนาม",meaning:"ปรากฏการณ์",examples:[
      {en:"Global warming is a serious [[phenomenon]].",th:"ภาวะโลกร้อนเป็นปรากฏการณ์ที่ร้ายแรง"},
      {en:"This is a common natural [[phenomenon]].",th:"นี่เป็นปรากฏการณ์ทางธรรมชาติที่พบได้ทั่วไป"}]},
    "accumulate":{ipa:"/əˈkjuːmjəleɪt/",pos:"คำกริยา",meaning:"สะสม, พอกพูน",examples:[

    "inevitable":{ipa:"/ɪnˈevɪtəbl/",pos:"คำคุณศัพท์",meaning:"ที่หลีกเลี่ยงไม่ได้",examples:[
      {en:"Some level of change is [[inevitable]].",th:"การเปลี่ยนแปลงในระดับหนึ่งเป็นสิ่งที่หลีกเลี่ยงไม่ได้"},
      {en:"Traffic jams seem [[inevitable]] in big cities.",th:"รถติดดูเหมือนจะหลีกเลี่ยงไม่ได้ในเมืองใหญ่"}]},
    "widespread":{ipa:"/ˈwaɪdspred/",pos:"คำคุณศัพท์",meaning:"แพร่หลาย, เป็นวงกว้าง",examples:[
      {en:"There is [[widespread]] concern about privacy.",th:"มีความกังวลเป็นวงกว้างเกี่ยวกับความเป็นส่วนตัว"},
      {en:"The use of the internet is now [[widespread]].",th:"การใช้อินเทอร์เน็ตแพร่หลายไปทั่วแล้วในตอนนี้"}]},
    "increase":{ipa:"/ɪnˈkriːs/",pos:"คำกริยา / คำนาม",meaning:"เพิ่มขึ้น / การเพิ่มขึ้น",examples:[
      {en:"The number of tourists [[increased]] steadily from 2015 to 2020.",th:"จำนวนนักท่องเที่ยวเพิ่มขึ้นอย่างสม่ำเสมอตั้งแต่ปี 2015 ถึง 2020"},
      {en:"There was a sharp [[increase]] in online sales.",th:"มีการเพิ่มขึ้นอย่างรวดเร็วของยอดขายออนไลน์"}],
      patterns:["an increase in ~","increase by ~%","a steady/sharp/slight increase","increase steadily / rapidly"],
      dialogue:[
        {speaker:"A",en:"Have you seen how much rent has gone up this year?",th:"คุณเห็นไหมว่าค่าเช่าปีนี้เพิ่มขึ้นแค่ไหน"},
        {speaker:"B",en:"Yeah, it increased by almost 15 percent.",th:"ใช่ มันเพิ่มขึ้นเกือบ 15 เปอร์เซ็นต์เลย"},
        {speaker:"A",en:"That's a huge increase.",th:"นั่นเป็นการเพิ่มขึ้นที่เยอะมากเลยนะ"}]},
    "decrease":{ipa:"/dɪˈkriːs/",pos:"คำกริยา / คำนาม",meaning:"ลดลง / การลดลง",examples:[
      {en:"Car ownership [[decreased]] slightly in the city centre.",th:"การเป็นเจ้าของรถยนต์ลดลงเล็กน้อยในใจกลางเมือง"},
      {en:"The graph shows a steady [[decrease]] in unemployment.",th:"กราฟแสดงการลดลงอย่างสม่ำเสมอของอัตราการว่างงาน"}],
      patterns:["a decrease in ~","decrease by ~%","a slight/steady decrease","decrease gradually / sharply"],
      dialogue:[
        {speaker:"A",en:"How's business been this month?",th:"ธุรกิจเดือนนี้เป็นยังไงบ้าง"},
        {speaker:"B",en:"Sales have decreased a bit, actually.",th:"จริงๆ แล้วยอดขายลดลงนิดหน่อย"},
        {speaker:"A",en:"By how much?",th:"ลดลงเท่าไหร่"},
        {speaker:"B",en:"About a ten percent decrease from last month.",th:"ลดลงประมาณสิบเปอร์เซ็นต์จากเดือนที่แล้ว"}]},
    "soar":{ipa:"/sɔːr/",pos:"คำกริยา",meaning:"พุ่งสูงขึ้นอย่างรวดเร็ว",examples:[
      {en:"House prices [[soared]] during the housing boom.",th:"ราคาบ้านพุ่งสูงขึ้นในช่วงตลาดอสังหาริมทรัพย์เฟื่องฟู"},
      {en:"Demand for face masks [[soared]] in early 2020.",th:"ความต้องการหน้ากากอนามัยพุ่งสูงขึ้นในช่วงต้นปี 2020"}],
      patterns:["prices/costs soar","soar to ~","soar by ~"],
      dialogue:[
        {speaker:"A",en:"Did you see the news about oil prices?",th:"เห็นข่าวเรื่องราคาน้ำมันไหม"},
        {speaker:"B",en:"Yeah, they've soared this week.",th:"เห็นสิ มันพุ่งขึ้นสูงมากอาทิตย์นี้"},
        {speaker:"A",en:"That's going to affect everyone.",th:"นั่นจะกระทบทุกคนเลยนะ"}]},
    "plummet":{ipa:"/ˈplʌmɪt/",pos:"คำกริยา",meaning:"ดิ่งลงอย่างรวดเร็ว",examples:[
      {en:"Sales [[plummeted]] after the scandal broke.",th:"ยอดขายดิ่งลงอย่างรวดเร็วหลังเกิดเรื่องอื้อฉาว"},
      {en:"The company's share price [[plummeted]] overnight.",th:"ราคาหุ้นของบริษัทดิ่งลงข้ามคืน"}],
      patterns:["~ plummets","plummet to ~","plummet by ~"],
      dialogue:[
        {speaker:"A",en:"How's the company's stock doing?",th:"หุ้นของบริษัทเป็นยังไงบ้าง"},
        {speaker:"B",en:"It plummeted after the announcement.",th:"มันดิ่งลงหลังจากมีการประกาศ"},
        {speaker:"A",en:"That sounds worrying.",th:"ฟังดูน่ากังวลนะ"}]},
    "surge":{ipa:"/sɜːrdʒ/",pos:"คำกริยา / คำนาม",meaning:"พุ่งขึ้นอย่างฉับพลัน / การพุ่งขึ้น",examples:[
      {en:"There was a [[surge]] in applications after the ad campaign.",th:"มีการพุ่งขึ้นของใบสมัครหลังแคมเปญโฆษณา"},
      {en:"Electricity use tends to [[surge]] during heatwaves.",th:"การใช้ไฟฟ้ามักพุ่งสูงขึ้นในช่วงคลื่นความร้อน"}]},
    "peak":{ipa:"/piːk/",pos:"คำนาม / คำกริยา",meaning:"จุดสูงสุด / ขึ้นถึงจุดสูงสุด",examples:[
      {en:"Sales [[peaked]] in December before falling again.",th:"ยอดขายขึ้นถึงจุดสูงสุดในเดือนธันวาคมก่อนจะลดลงอีกครั้ง"},

    "plateau":{ipa:"/pləˈtoʊ/",pos:"คำนาม / คำกริยา",meaning:"ช่วงคงที่ / คงที่ (หลังจากขึ้นหรือลง)",examples:[

      dialogue:[
        {speaker:"A",en:"Is the app still growing fast?",th:"แอปยังโตเร็วอยู่ไหม"},
        {speaker:"B",en:"Not really, growth has plateaued recently.",th:"ไม่ค่อยแล้ว การเติบโตเริ่มคงที่เมื่อเร็วๆ นี้"},
        {speaker:"A",en:"Maybe it's time for a new feature.",th:"อาจถึงเวลาต้องมีฟีเจอร์ใหม่แล้วมั้ง"}]},
    "steady":{ipa:"/ˈstedi/",pos:"คำคุณศัพท์",meaning:"สม่ำเสมอ, คงที่",examples:[
      {en:"The company reported [[steady]] growth this year.",th:"บริษัทรายงานการเติบโตอย่างสม่ำเสมอในปีนี้"},
      {en:"There has been a [[steady]] rise in electric car sales.",th:"มีการเพิ่มขึ้นอย่างสม่ำเสมอของยอดขายรถยนต์ไฟฟ้า"}],
      patterns:["a steady increase/rise/growth","remain steady","steady progress"],
      dialogue:[
        {speaker:"A",en:"How's your English improving?",th:"ภาษาอังกฤษของคุณพัฒนายังไงบ้าง"},
        {speaker:"B",en:"Slowly, but it's steady progress.",th:"ช้าๆ แต่ก็เป็นความก้าวหน้าที่สม่ำเสมอ"},

    "sharply":{ipa:"/ˈʃɑːrpli/",pos:"คำวิเศษณ์",meaning:"อย่างรวดเร็ว/ชัน",examples:[
      {en:"Unemployment rose [[sharply]] during the recession.",th:"อัตราการว่างงานเพิ่มขึ้นอย่างรวดเร็วในช่วงเศรษฐกิจถดถอย"},
      {en:"Temperatures dropped [[sharply]] overnight.",th:"อุณหภูมิลดลงอย่างรวดเร็วในชั่วข้ามคืน"}]},

      {en:"Online shopping is expected to [[overtake]] in-store sales.",th:"การช้อปปิ้งออนไลน์คาดว่าจะแซงหน้ายอดขายหน้าร้าน"}]},
    "respectively":{ipa:"/rɪˈspektɪvli/",pos:"คำวิเศษณ์",meaning:"ตามลำดับ",examples:[

      {en:"Men prefer coffee, [[whereas]] women prefer tea.",th:"ผู้ชายชอบกาแฟ ในขณะที่ผู้หญิงชอบชา"}]},
    "overall":{ipa:"/ˌoʊvərˈɔːl/",pos:"คำวิเศษณ์",meaning:"โดยรวม",examples:[

      {en:"[[Overall]], expenditure on education rose slightly.",th:"โดยรวมแล้ว ค่าใช้จ่ายด้านการศึกษาเพิ่มขึ้นเล็กน้อย"}]},
    "dip":{ipa:"/dɪp/",pos:"คำนาม / คำกริยา",meaning:"การลดลงชั่วคราว / ลดลงชั่วคราว",examples:[
      {en:"There was a brief [[dip]] in sales during the summer.",th:"มีการลดลงชั่วคราวของยอดขายในช่วงฤดูร้อน"},
      {en:"Confidence [[dipped]] slightly before recovering.",th:"ความเชื่อมั่นลดลงเล็กน้อยก่อนจะฟื้นตัว"}]},
    "rocket":{ipa:"/ˈrɒkɪt/",pos:"คำกริยา",meaning:"พุ่งขึ้นอย่างรวดเร็ว",examples:[

    "stagnant":{ipa:"/ˈstæɡnənt/",pos:"คำคุณศัพท์",meaning:"หยุดนิ่ง, ไม่เปลี่ยนแปลง",examples:[

    "downward":{ipa:"/ˈdaʊnwərd/",pos:"คำคุณศัพท์",meaning:"ทิศทางขาลง",examples:[

    "upward":{ipa:"/ˈʌpwərd/",pos:"คำคุณศัพท์",meaning:"ทิศทางขาขึ้น",examples:[

    "account for":{ipa:"/əˈkaʊnt fɔːr/",pos:"คำกริยา (วลี)",meaning:"คิดเป็นสัดส่วน (ของทั้งหมด)",examples:[
      {en:"Renewable energy [[accounted for]] 30% of total power generation.",th:"พลังงานหมุนเวียนคิดเป็น 30% ของการผลิตไฟฟ้าทั้งหมด"},
      {en:"Housing costs [[account for]] nearly half of household spending.",th:"ค่าที่อยู่อาศัยคิดเป็นเกือบครึ่งหนึ่งของค่าใช้จ่ายในครัวเรือน"}],
      patterns:["~ account(s) for ~%","~ accounted for the largest/smallest share"]},

      {en:"Women [[constitute]] more than half of the workforce.",th:"ผู้หญิงคิดเป็นมากกว่าครึ่งหนึ่งของแรงงานทั้งหมด"},
      {en:"International students [[constitute]] a small proportion of enrolments.",th:"นักศึกษาต่างชาติคิดเป็นสัดส่วนเล็กน้อยของผู้ลงทะเบียน"}]},
    "represent":{ipa:"/ˌreprɪˈzent/",pos:"คำกริยา",meaning:"แทน, คิดเป็นสัดส่วนหนึ่ง (ในแผนภูมิ)",examples:[

      {en:"This figure [[represents]] a quarter of total revenue.",th:"ตัวเลขนี้คิดเป็นหนึ่งในสี่ของรายได้ทั้งหมด"}]},
    "make up":{ipa:"/meɪk ʌp/",pos:"คำกริยา (วลี)",meaning:"ประกอบกันขึ้นเป็น, คิดเป็นสัดส่วน",examples:[
      {en:"Young people [[make up]] nearly 40% of the population.",th:"คนหนุ่มสาวคิดเป็นเกือบ 40% ของประชากร"},
      {en:"Part-time workers [[make up]] a growing share of the labor force.",th:"แรงงานพาร์ทไทม์คิดเป็นสัดส่วนที่เพิ่มขึ้นของกำลังแรงงาน"}]},
    "a fraction of":{ipa:"/ə ˈfrækʃn əv/",pos:"คำนาม (วลี)",meaning:"เศษส่วนหนึ่งของ, ส่วนน้อยของ",examples:[

  /* ---------- graph-shape sparkline: shown on flashcard reveal for trend words ---------- */
  const SHAPES = {
    steepRise:[15,18,22,85], gentleRise:[15,30,45,62,80], steepFall:[85,80,75,15],
    gentleFall:[80,63,46,30,15], peak:[15,45,82,45,15], plateau:[15,45,78,79,80],
    stagnant:[48,52,47,50,49], dip:[72,42,38,62,80], slight:[45,50,53,56]

    increase:'gentleRise', decrease:'gentleFall', soar:'steepRise', plummet:'steepFall',
    surge:'steepRise', peak:'peak', plateau:'plateau', steady:'gentleRise',
    sharply:'steepRise', slightly:'slight', dip:'dip', rocket:'steepRise',
    stagnant:'stagnant', downward:'gentleFall', upward:'gentleRise'
  };
  function sparkGeom(values,W,H,pad){
    const n=values.length, min=Math.min(...values), max=Math.max(...values), range=(max-min)||1;
    const xs=values.map((_,i)=> pad + (n===1?0:(i/(n-1))*(W-pad*2)));
    const ys=values.map(v=> H-pad - ((v-min)/range)*(H-pad*2));
    return {xs,ys};
  }
  function getShape(card){
    if(card && Array.isArray(card.shape) && card.shape.length>=2) return card.shape;
    const t=WORD_SHAPE[norm((card&&card.word)||'')];

    const wc=WORD_CHART[norm((card&&card.word)||'')];
    return wc?wc.data:null;
  }
  function sparkSVG(values){
    const W=132,H=54,pad=7;
    const {xs,ys}=sparkGeom(values,W,H,pad);
    const pts=xs.map((x,i)=>`${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
    const lastI=xs.length-1;
    return `<svg viewBox="0 0 ${W} ${H}" class="spark">
      <polyline points="${pts}" fill="none" stroke="var(--teal)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${xs[lastI].toFixed(1)}" cy="${ys[lastI].toFixed(1)}" r="3" fill="var(--teal)"/>
    </svg>`;
  }

  function barSparkSVG(values){
    const W=132,H=54,pad=6,gap=6,n=values.length;
    const max=Math.max(...values)||1;
    const barW=(W-pad*2-(n-1)*gap)/n;
    const bars=values.map((v,i)=>{
      const h=(v/max)*(H-pad*2), x=pad+i*(barW+gap), y=H-pad-h;
      return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="var(--teal)"/>`;
    }).join('');
    return `<svg viewBox="0 0 ${W} ${H}" class="spark">${bars}</svg>`;
  }
  function pieSparkSVG(segments){
    const W=132,H=54,cx=W/2,cy=27,r=22;
    const total=segments.reduce((a,b)=>a+b,0)||1;
    const shades=['var(--teal)','#7fb8ab','#b7d9cf','#dcece7'];
    let angle=-90;
    const paths=segments.map((v,i)=>{
      const slice=(v/total)*360;
      const a1=angle*Math.PI/180, a2=(angle+slice)*Math.PI/180;
      const x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
      const x2=cx+r*Math.cos(a2), y2=cy+r*Math.sin(a2);
      const large=slice>180?1:0;
      angle+=slice;
      return `<path d="M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 ${large} 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z" fill="${shades[i%shades.length]}"/>`;
    }).join('');
    return `<svg viewBox="0 0 ${W} ${H}" class="spark">${paths}</svg>`;
  }
  function chartSVG(card, values){

    const synth=window.speechSynthesis; synth.cancel();

    let i=0;
    function next(){
      if(i>=texts.length){ if(onDone) onDone(); return; }
      const u=new SpeechSynthesisUtterance(plain(texts[i]));
      u.lang='en-US'; u.rate=0.88; u.pitch=1;
      const v=VOICES.find(x=>/en[-_]US/i.test(x.lang))||VOICES.find(x=>/^en/i.test(x.lang));

  /* ---------- spaced repetition ---------- */
  function schedule(card, rating){
    let {ease=2.5, interval=0, reps=0, lapses=0, state='new'} = card;
    const now=Date.now(), fresh = state==='new'||interval===0; let due;
    if(rating==='again'){ ease=Math.max(MIN_EASE,ease-0.2); lapses++; interval=0; state='learning'; due=now+10*60*1000; }
    else if(rating==='hard'){
      ease=Math.max(MIN_EASE,ease-0.15);
      if(fresh){ interval=0; state='learning'; due=now+20*60*1000; }
      else { interval=Math.max(1,interval*1.2); state='review'; due=now+interval*DAY; }
    }
    else if(rating==='good'){ interval=fresh?1:interval*ease; state='review'; due=now+interval*DAY; }
    else { ease+=0.15; interval=fresh?2:interval*ease*1.3; state='review'; due=now+interval*DAY; }
    reps++;
    return {ease,interval:Math.round(interval*100)/100,reps,lapses,state,due};
  }
  function fmtDue(ms){
    const MIN=60000, HOUR=3600000;
    if(ms<HOUR) return Math.max(1,Math.round(ms/MIN))+'น.';
    if(ms<DAY) return Math.round(ms/HOUR)+'ชม.';
    const d=ms/DAY;
    if(d<30) return Math.round(d)+'ว.'; if(d<365) return Math.round(d/30)+'ด.'; return (d/365).toFixed(1)+'ปี';
  }

  function importDict(raw){

    let entries=[];

  const MODELS=["claude-haiku-4-5-20251001","claude-sonnet-5","claude-sonnet-4-6"];
  async function callModel(prompt, model){
    const res = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:model,max_tokens:1000,messages:[{role:"user",content:prompt}]})

    if(!res.ok){ let bt="";try{bt=await res.text();}catch(_){}
      throw new Error("HTTP "+res.status+" ["+model+"]"+(bt?" · "+bt.slice(0,240):"")); }
    const d=await res.json();
    if(d&&d.error) throw new Error("API ["+model+"] · "+String(d.error.message||JSON.stringify(d.error)).slice(0,240));
    const text=(d.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("").trim();
    if(!text) throw new Error("ตอบว่าง ["+model+"] · "+JSON.stringify(d).slice(0,200));
    return text;
  }
  async function lookupLive(word){
    const prompt =
`You help Thai learners of English understand vocabulary through real, natural example sentences.
Respond with ONLY a valid JSON object — no markdown, no code fences, no text before or after.
Shape:
{"headword":"the word lowercased (or English equivalent if input is Thai)","reading":"simple pronunciation like /wɜːrd/ or empty","pos":"part of speech in Thai (คำนาม/คำกริยา/คำคุณศัพท์/คำวิเศษณ์) or empty","meaning":"clear concise Thai meaning","examples":[{"sentence":"natural everyday English sentence; wrap the target word (exact form incl. inflection) in [[ ]]","translation":"คำแปลไทย"}]}
Rules: exactly 2 example sentences; wrap target word in [[ ]] once per sentence; output JSON only.
Word: `+JSON.stringify(word);
    let text=null, lastErr=null;
    for(const m of MODELS){ try{ text=await callModel(prompt,m); break; }catch(e){ lastErr=e; } }
    if(text==null) throw (lastErr||new Error("ทุกโมเดลใช้ไม่ได้"));
    text=text.replace(/```json/gi,"").replace(/```/g,"").trim();
    const a=text.indexOf("{"),b=text.lastIndexOf("}"); if(a>-1&&b>-1) text=text.slice(a,b+1);
    const p=JSON.parse(text);
    if(!p.examples||!p.examples.length) throw new Error("format");
    return { word:norm(p.headword||word), ipa:p.reading||'', pos:p.pos||'', meaning:p.meaning||'',
      examples:p.examples.map(e=>({en:e.sentence,th:e.translation})), notFound:false };
  }

  function shuffle(arr){ return [...arr].sort(()=>Math.random()-0.5); }
  function buildQuiz(n, catFilter){
    catFilter = catFilter||'all';
    let pool = data.cards.filter(c=>c.meaning);
    if(catFilter==='graph') pool = pool.filter(c=>getShape(c));
    else if(catFilter==='general') pool = pool.filter(c=>!getShape(c));
    if(pool.length<4) return [];
    const graphPool = pool.filter(c=>getShape(c));
    const weighted=[];
    pool.forEach(c=>{
      const w=wordStrength(c);
      const wt = w==='weak'?4 : (w==='mid'||w==='new')?2 : 1;
      for(let k=0;k<wt;k++) weighted.push(c);
    });
    const count = Math.min(n, pool.length*2);
    const picks = shuffle(weighted).slice(0,count);
    return picks.map(card=>{
      const r = Math.random();
      let type = r<0.28 ? 'mc-meaning' : (r<0.53 && graphPool.length>=4) ? 'mc-graph' : (r<0.76 ? 'write-word' : 'write-sentence');
      if(type==='mc-graph' && graphPool.length<4) type='mc-meaning';
      if(type==='mc-meaning'){
        const wrong = shuffle(pool.filter(c=>c!==card && c.meaning!==card.meaning)).slice(0,3).map(c=>c.meaning);
        const options = shuffle([card.meaning,...wrong]);
        return {type,card,options,correctIdx:options.indexOf(card.meaning)};
      }
      if(type==='mc-graph'){
        const wrong = shuffle(graphPool.filter(c=>c!==card)).slice(0,3).map(c=>c.word);
        const options = shuffle([card.word,...wrong]);
        return {type,card,shape:getShape(card),options,correctIdx:options.indexOf(card.word)};
      }
      return {type,card};
    });
  }
  const SHAPE_DESC = {
    steepRise:'พุ่งขึ้นอย่างรวดเร็วและรุนแรง', gentleRise:'เพิ่มขึ้นทีละน้อยอย่างสม่ำเสมอ',
    steepFall:'ดิ่งลงอย่างรวดเร็วและรุนแรง', gentleFall:'ลดลงทีละน้อยอย่างค่อยเป็นค่อยไป',
    peak:'ขึ้นถึงจุดสูงสุดแล้วลดลง', plateau:'คงที่หลังจากมีการเปลี่ยนแปลงมาก่อน',
    stagnant:'แทบไม่เปลี่ยนแปลงเลย', dip:'ลดลงชั่วคราวแล้วฟื้นตัวกลับขึ้นมา', slight:'เปลี่ยนแปลงเพียงเล็กน้อย'
  };
  function getShapeDesc(card){
    if(card && card.shapeDesc) return card.shapeDesc;
    const t=WORD_SHAPE[norm((card&&card.word)||'')];
    if(t) return SHAPE_DESC[t];
    const wc=WORD_CHART[norm((card&&card.word)||'')];
    return wc?wc.desc:null;
  }
  function quizExplain(q){
    const c=q.card, ex=(c.examples&&c.examples[0])||null;

    return `<div class="quiz-explain"><div class="qexp-title">ทำไมถึงใช้คำนี้ / ใช้ยังไง</div>${rows.join('')}</div>`;

  function wordStrength(c){
    if(c.reps===0) return 'new';
    if(c.lapses>=2 || c.ease<=1.7) return 'weak';
    if(c.ease>=2.6 && c.interval>=7 && c.reps>=2) return 'strong';
    return 'mid';
  }
  function fmtIvl(days){
    if(days<1) return 'วันนี้'; if(days<30) return Math.round(days)+' วัน';

  }

  function renderStats(){
    const cards=data.cards;

    const mid=cards.filter(c=>wordStrength(c)==='mid').length;
    const isNew=cards.filter(c=>wordStrength(c)==='new').length;
    const dueN=dueCards().length;
    const pct = cards.length? Math.round(strong.length/cards.length*100):0;
    return `
      ${renderExamCard()}
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-num">${cards.length}</div><div class="stat-lbl">ทั้งหมด</div></div>
        <div class="stat-card good"><div class="stat-num">${strong.length}</div><div class="stat-lbl">จำได้ดี</div></div>
        <div class="stat-card warn"><div class="stat-num">${weak.length}</div><div class="stat-lbl">ควรทบทวน</div></div>
        <div class="stat-card"><div class="stat-num">${dueN}</div><div class="stat-lbl">ถึงกำหนดวันนี้</div></div>
      </div>
      <div class="stat-progress-wrap">
        <div class="stat-progress-label"><span>ความจำโดยรวม</span><span>${pct}%</span></div>
        <div class="stat-progress"><i style="width:${pct}%"></i></div>
        <div class="stat-progress-note">จำได้ดี ${strong.length} · กำลังจำ ${mid} · ยังไม่เริ่ม ${isNew} · ควรทบทวน ${weak.length}</div>
      </div>
      ${weak.length?`<div class="stat-section">
        <div class="stat-sec-title warn">🎯 ควรโฟกัสคำเหล่านี้</div>
        <div class="stat-list">
          ${weak.slice(0,12).map(c=>`<div class="stat-row">
            <div class="stat-word">${esc(c.word)}</div>
            <div class="stat-mean">${esc(c.meaning||'')}</div>
            <span class="stat-badge warn">${c.lapses>=1?'ลืม '+c.lapses+' ครั้ง':'ยังไม่แม่น'}</span>
          </div>`).join('')}
        </div>
      </div>`:''}
      ${strong.length?`<div class="stat-section">
        <div class="stat-sec-title good">✓ คำที่จำได้ดีแล้ว</div>
        <div class="stat-list">
          ${strong.slice(0,12).map(c=>`<div class="stat-row">
            <div class="stat-word">${esc(c.word)}</div>
            <div class="stat-mean">${esc(c.meaning||'')}</div>
            <span class="stat-badge good">ทบทวนอีกใน ${fmtIvl(c.interval)}</span>
          </div>`).join('')}
        </div>
      </div>`:''}
      ${(!weak.length && !strong.length)?`<div class="center-state" style="padding:30px 20px"><p>ทบทวนต่อไปเรื่อยๆ นะครับ อีกสักพักสถิติจะเริ่มแยกชัดเจนขึ้น</p></div>`:''}
    `;
  }


  function renderManage(){
    const cards=data.cards;
    return `
      <div class="section" style="border-color:var(--teal);background:var(--teal-soft)">
        <h3 style="color:var(--teal)">ชุดคำศัพท์ IELTS</h3>
        <p style="font-size:13px;color:var(--ink-soft);line-height:1.55;margin-bottom:12px">คำศัพท์วิชาการสำหรับสอบ IELTS ${DICT_KEYS.length} คำ — ค้นหาได้เลยในแท็บค้นหา หรือกดปุ่มด้านล่างเพื่อเพิ่มทั้งชุดลงแฟลชการ์ด</p>
        <button class="btn primary full" data-act="load-ielts">+ เพิ่มชุด IELTS ทั้งหมดลงแฟลชการ์ด (${DICT_KEYS.length} คำ)</button>
      </div>
      <div class="section">
        <h3>นำเข้าคำเป็นชุด</h3>
        <p style="font-size:12.5px;color:var(--faint);line-height:1.55;margin-bottom:10px">อยากได้คำนอกคลัง? บอก Claude ในแชทว่าต้องการคำหรือหัวข้อไหน แล้ววางข้อมูล (JSON) ที่ได้ลงช่องนี้ — คำจะถูกเพิ่มเข้าคลัง (ค้นหาได้) และเพิ่มเป็นการ์ดให้อัตโนมัติ ถ้าเป็นคำบรรยายกราฟ ใส่ฟิลด์ "shape" (array ตัวเลข) มาด้วยได้ จะมีเส้นกราฟเล็กๆ โผล่ตอนดูเฉลยด้วย</p>
        <textarea class="fld" id="imp" placeholder="วางข้อมูลจาก Claude ที่นี่…" rows="4"></textarea>
        <button class="btn primary full" data-act="import-dict">นำเข้า</button>
      </div>
      <div class="section">
        <h3>เพิ่มคำเอง</h3>
        <input class="fld" id="mw" placeholder="คำศัพท์ (อังกฤษ)" autocapitalize="none">
        <input class="fld" id="mm" placeholder="ความหมาย (ไทย)">
        <textarea class="fld" id="me" placeholder="ประโยคตัวอย่าง (ไม่ใส่ก็ได้)" rows="2"></textarea>
        <textarea class="fld" id="met" placeholder="คำแปลประโยค (ไม่ใส่ก็ได้)" rows="2"></textarea>
        <button class="btn primary full" data-act="manual-add">เพิ่มการ์ด</button>
      </div>
      <div class="section">
        <div class="listhead"><h3>การ์ดทั้งหมด</h3><div style="display:flex;gap:10px;align-items:center">${cards.length?`<button class="iconbtn del" data-act="clear-cards">ล้างทั้งหมด</button>`:''}<span class="count-pill">${cards.length} ใบ</span></div></div>
        <div class="clist">
          ${cards.length===0?`<div class="empty-list">ยังไม่มีการ์ด<br>ค้นหาคำแล้วกด "เพิ่มลงแฟลชการ์ด" ได้เลย</div>`:
            cards.slice().reverse().map(c=>{
              const st=c.state==='new'?['new','ใหม่']:c.state==='learning'?['learn','เรียน']:['rev','ทบทวน'];
              return `<div class="crow">
                <button class="spk sm" data-act="say" data-text="${esc(c.word)}">${SPK}</button>
                <div class="txt"><div class="cw">${esc(c.word)}</div><div class="cm">${esc(c.meaning||'')}</div></div>
                <span class="cst ${st[0]}">${st[1]}</span>
                <button class="iconbtn del" data-act="del-card" data-id="${c.id}">ลบ</button>
              </div>`;
            }).join('')}
        </div>
      </div>
      <div class="section">
        <details class="backup">
          <summary>💾 สำรอง / กู้คืนข้อมูลทั้งหมด</summary>
          <div style="margin-top:14px">
            <p style="font-size:12px;color:var(--faint);line-height:1.6;margin-bottom:10px">คำ, ความคืบหน้า, streak ทั้งหมดอยู่ในเบราว์เซอร์นี้เท่านั้น ถ้าเคลียร์ข้อมูลเว็บหรือเปลี่ยนเครื่อง <b>จะหายทันทีถ้าไม่ได้สำรองไว้</b> — กด "คัดลอกข้อมูล" เก็บไว้ในโน้ตหรือส่งให้ตัวเองเป็นระยะ</p>
            <button class="btn subtle full" data-act="export-data" style="margin-bottom:10px">คัดลอกข้อมูลสำรอง</button>
            <textarea class="fld" id="backup-out" rows="3" readonly placeholder="กดปุ่มด้านบนเพื่อสร้างข้อมูลสำรอง..." style="font-family:ui-monospace,monospace;font-size:11px"></textarea>
            <div style="height:14px"></div>
            <p style="font-size:12px;color:var(--faint);line-height:1.6;margin-bottom:8px">วางข้อมูลสำรองที่เคยคัดลอกไว้ เพื่อกู้คืน — <b>จะแทนที่ข้อมูลปัจจุบันทั้งหมด</b></p>
            <textarea class="fld" id="backup-in" rows="3" placeholder="วางข้อมูลสำรองที่นี่..." style="font-family:ui-monospace,monospace;font-size:11px"></textarea>
            <button class="btn danger full" data-act="import-data" style="margin-top:8px">กู้คืนข้อมูล (แทนที่ทั้งหมด)</button>
          </div>
        </details>
      </div>`;
  }

  /* ---------- events ---------- */
  function rate(r){
    const card=data.cards.find(c=>c.id===ui.queue[ui.idx]); if(!card) return;
    Object.assign(card, schedule(card,r)); bumpStreak(); save();
    if(r==='again') ui.queue.push(card.id);
    ui.idx++; ui.revealed=false;
    if(speechOK) window.speechSynthesis.cancel();
    render();
  }

  app.addEventListener('click',e=>{
    const t=e.target.closest('[data-act]'); if(!t) return;
    const a=t.dataset.act;
    if(a==='say'){ e.stopPropagation(); speak(t.dataset.text, t); return; }
    if(a==='tab'){ ui.tab=t.dataset.tab; if(ui.tab==='flash'&&ui.fcMode==='review') buildQueue(); render();
      if(ui.tab==='search'){const i=app.querySelector('#q'); if(i&&!ui.current&&!ui.loading) i.focus();} return; }
    if(a==='fcmode'){ ui.fcMode=t.dataset.m; if(ui.fcMode==='review') buildQueue(); render(); return; }
    if(a==='listen-mode'){ ui.listen.on=!ui.listen.on; ui.listen.playing=false; if(speechOK) window.speechSynthesis.cancel(); render(); return; }
    if(a==='listen-toggle'){
      if(ui.listen.playing){ ui.listen.playing=false; if(speechOK) window.speechSynthesis.cancel(); render(); }
      else { playCurrentListen(); }
      return;
    }
    if(a==='listen-next'){ ui.listen.playing=false; if(speechOK) window.speechSynthesis.cancel(); ui.listen.idx=(ui.listen.idx+1)%data.cards.length; render(); return; }
    if(a==='listen-prev'){ ui.listen.playing=false; if(speechOK) window.speechSynthesis.cancel(); ui.listen.idx=(ui.listen.idx-1+data.cards.length)%data.cards.length; render(); return; }
    if(a==='quiz-cat'){ ui.catFilter=t.dataset.c; render(); return; }
    if(a==='quiz-start'){ ui.quiz={questions:buildQuiz(10,ui.catFilter),idx:0,score:0,answered:false,selectedIdx:null,correct:null,writtenSentence:'',done:false}; render(); return; }
    if(a==='quiz-restart'){ ui.quiz=null; render(); return; }
    if(a==='quiz-pick'){
      if(ui.quiz.answered) return;
      const i=+t.dataset.i, q=ui.quiz.questions[ui.quiz.idx];
      ui.quiz.selectedIdx=i; ui.quiz.answered=true;
      if(i===q.correctIdx) ui.quiz.score++;
      render(); return;
    }
    if(a==='quiz-submit'){
      const q=ui.quiz.questions[ui.quiz.idx];
      const val=app.querySelector('#quiz-write').value;
      const ok = norm(val)===norm(q.card.word);
      ui.quiz.answered=true; ui.quiz.correct=ok;
      if(ok) ui.quiz.score++;
      render(); return;
    }
    if(a==='quiz-submit-sentence'){
      const q=ui.quiz.questions[ui.quiz.idx];
      const val=(app.querySelector('#quiz-sentence').value||'').trim();
      const ok = val.length>0 && val.toLowerCase().includes(q.card.word.toLowerCase());
      ui.quiz.answered=true; ui.quiz.correct=ok; ui.quiz.writtenSentence=val;
      if(ok) ui.quiz.score++;
      render(); return;
    }
    if(a==='quiz-next'){
      ui.quiz.idx++; ui.quiz.answered=false; ui.quiz.selectedIdx=null; ui.quiz.correct=null; ui.quiz.writtenSentence='';
      if(ui.quiz.idx>=ui.quiz.questions.length) ui.quiz.done=true;
      render(); return;
    }
    if(a==='search'){ doSearch(app.querySelector('#q').value); return; }
    if(a==='chip'){ doSearch(t.dataset.w); return; }
    if(a==='reveal'){ ui.revealed=true; render(); return; }
    if(a==='rate'){ e.stopPropagation(); rate(t.dataset.r); return; }
    if(a==='add'){
      const c=cache[norm(t.dataset.word)]||ui.current;
      if(c && !c.notFound){ if(addCard(c)){ toast('เพิ่มลงแฟลชการ์ดแล้ว'); } render(); }
      return;
    }
    if(a==='add-word-only'){
      const w=norm(t.dataset.word);
      if(!hasCard(w)){ addCard({word:w, ipa:'', pos:'', meaning:'', examples:[]}); toast('เพิ่มแล้ว — ไปใส่ความหมายที่หน้า "จัดการคำ"'); }
      render(); return;
    }
    if(a==='load-ielts'){
      let added=0; DICT_KEYS.forEach(w=>{ if(!hasCard(w)){ addCard(fromDict(w)); added++; } });
      buildQueue(); render(); toast(added?('เพิ่ม '+added+' คำลงแฟลชการ์ดแล้ว'):'มีครบทุกคำแล้ว');
      return;
    }
    if(a==='clear-cards'){ if(data.cards.length && confirm('ลบการ์ดทั้งหมดใช่ไหม?')){ data.cards=[]; save(); buildQueue(); render(); toast('ล้างการ์ดแล้ว'); } return; }
    if(a==='set-exam-date'){
      const val=app.querySelector('#exam-date-input').value;
      if(!val){ toast('เลือกวันที่ก่อน'); return; }
      data.examDate=val; save(); render(); toast('ตั้งวันสอบแล้ว');
      return;
    }
    if(a==='clear-exam-date'){ data.examDate=null; save(); render(); return; }
    if(a==='export-data'){
      const json=JSON.stringify(data);
      const out=app.querySelector('#backup-out'); if(out) out.value=json;
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(json).then(()=>toast('คัดลอกข้อมูลสำรองแล้ว')).catch(()=>toast('สร้างข้อมูลแล้ว — กดเลือกในช่องเพื่อคัดลอกเอง'));
      } else { toast('สร้างข้อมูลแล้ว — กดเลือกในช่องเพื่อคัดลอกเอง'); }
      return;
    }
    if(a==='import-data'){
      const raw=(app.querySelector('#backup-in').value||'').trim();
      if(!raw){ toast('วางข้อมูลสำรองก่อน'); return; }
      let parsed;
      try{ parsed=JSON.parse(raw); }catch(e){ toast('ข้อมูลไม่ถูกต้อง (ต้องเป็น JSON)'); return; }
      if(!parsed||!Array.isArray(parsed.cards)){ toast('ไฟล์นี้ไม่ใช่ข้อมูลสำรองของ Lexi'); return; }
      if(!confirm('กู้คืนข้อมูลนี้จะแทนที่คำ ความคืบหน้า และ streak ปัจจุบันทั้งหมด ยืนยันไหม?')) return;
      data=parsed;
      if(!data.userDict) data.userDict={};
      if(!data.streak) data.streak={count:0,lastDate:0};
      save(); buildQueue(); render(); toast('กู้คืนข้อมูลสำเร็จ');
      return;
    }
    if(a==='import-dict'){ importDict(app.querySelector('#imp').value); return; }
    if(a==='manual-add'){
      const w=app.querySelector('#mw').value.trim();
      const m=app.querySelector('#mm').value.trim();
      const en=app.querySelector('#me').value.trim();
      const th=app.querySelector('#met').value.trim();
      if(!w){ toast('ใส่คำศัพท์ก่อน'); return; }
      if(hasCard(w)){ toast('มีคำนี้อยู่แล้ว'); return; }
      const exs = en?[{en:en,th:th}]:[];
      addCard({word:w.toLowerCase(), ipa:'', pos:'', meaning:m, examples:exs});
      toast('เพิ่มการ์ดแล้ว'); render(); return;
    }
    if(a==='del-card'){ const i=data.cards.findIndex(c=>c.id===t.dataset.id); if(i>-1){ data.cards.splice(i,1); save(); buildQueue(); render(); } return; }
  });

  app.addEventListener('keydown',e=>{
    if(e.key==='Enter' && e.target.id==='quiz-write'){ e.preventDefault(); app.querySelector('[data-act="quiz-submit"]')?.click(); return; }
    if(e.key==='Enter' && e.target.dataset && e.target.dataset.role==='q'){ e.preventDefault(); doSearch(e.target.value); return; }
    if(ui.tab==='flash' && ui.fcMode==='review'){
      if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
      if(!ui.revealed && (e.code==='Space'||e.code==='Enter')){ e.preventDefault(); ui.revealed=true; render(); return; }
      if(ui.revealed){ const map={Digit1:'again',Digit2:'hard',Digit3:'good',Digit4:'easy',Space:'good'}; const r=map[e.code]; if(r){ e.preventDefault(); rate(r); } }
    }
  });

  /* ---------- boot ---------- */
  (async function(){
    const loaded=await load();
    if(loaded && Array.isArray(loaded.cards)) data=loaded;
    if(!data.userDict) data.userDict={};
    if(!data.streak) data.streak={count:0,lastDate:0};
    if(!loaded || !Array.isArray(loaded.cards)){
      // เริ่มด้วยแฟลชการ์ดว่าง — ผู้ใช้เลือกคำที่ต้องการเอง (โหลดชุด IELTS หรือเพิ่มคำเอง)
    }
    buildQueue(); render();
    const i=app.querySelector('#q'); if(i) i.focus();
  })();
})();
</script>
</body>
</html>
